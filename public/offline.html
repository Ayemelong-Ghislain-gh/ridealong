<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C2321" />
    <title>No connection · Ride Along</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c2321;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 24px; margin: 20px 0 8px; }
      p { color: rgba(255, 255, 255, 0.7); margin: 0 auto 24px; max-width: 320px; line-height: 1.5; }
      button {
        background: #f2b705; color: #1c2321; border: 0; border-radius: 12px;
        font-size: 16px; font-weight: 700; padding: 14px 24px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Ride Along needs a connection to show live trips and seats. Check your data or Wi‑Fi and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
